[package]
name = "build-util"
version = "0.1.0"
edition = "2021"

[dependencies]
cargo_metadata = "0.23"
pathos = "0.3"
log = "0.4"
spirv_cross_sys = { path = "../vendor/spirv-cross-sys", features = ["msl", "hlsl"] }
