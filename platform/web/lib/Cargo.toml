[package]
name = "sourcerenderer_web"
version = "0.1.0"
authors = ["Robin Kertels <robin.kertels@gmail.com>"]
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
js-sys = "0.3"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
sourcerenderer_core = { path = "../../../core", features = ["non_send_io", "non_send_gpu"] }
sourcerenderer_engine = { path = "../../../engine", default-features = false, features = ["render_thread", "non_send_gpu", "non_send_io"] }
# sourcerenderer_engine = { path = "../../../engine", default-features = false, features = ["non_send_gpu", "non_send_io"] }
sourcerenderer_webgpu = { path = "../../../graphics/webgpu" }
sourcerenderer_game = { path = "../../../game" }
serde = "1.0"
serde_derive = "1.0"
rayon = "1.10"
lazy_static = "1.5"
crossbeam-channel = "0.5"
async-channel = "2.3"
wasm-bindgen-futures = "0.4"
log = "0.4"
console_log = "1.0"
futures-lite = "2.6"
async-lock = "3.4"
async-task = "4.7"
web-task = "1.1"

# Needs to be specified here with old versions to make sure dependencies that have it as a dependency get the version
# with the feature enabled
getrandom-old = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom-new = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }

[dependencies.web-sys]
version = "0.3"
features = [
    'Document',
    'Element',
    'HtmlCanvasElement',
    'Window',
    'Worker',
    'DedicatedWorkerGlobalScope',
    'Navigator',
    'ErrorEvent',
    'Response',
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[build-dependencies]
spirv_cross_sys = { path = "../../../vendor/spirv-cross-sys" }
build-util = { path = "../../../build_util" }
log = "0.4"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true
debug = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
debug-js-glue = true
demangle-name-section = true
dwarf-debug-info = true
