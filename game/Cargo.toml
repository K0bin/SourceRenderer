[package]
name = "sourcerenderer_game"
version = "0.1.0"
edition = "2024"

[features]
default = ["uni_project"]
uni_project = []
test_game = []

[dependencies]
sourcerenderer_core = { path = "../core" }
sourcerenderer_engine = { path = "../engine", default-features = false }
log = "0.4"
bevy_app = "0.20"
bevy_math = { version = "0.20", features = ["serialize"] }
bevy_ecs = "0.20"
bevy_transform = "0.20"
bevy_tasks = "0.20"
bevy_utils = "0.20"
bevy_time = "0.20"
bevy_input = "0.20"
bytemuck = { version = "1.25", features = ["extern_crate_std"] }
smallvec = { version = "1.16", features = ["union", "const_generics", "const_new"] }
