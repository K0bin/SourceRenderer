[package]
name = "sourcerenderer_core"
version = "0.1.0"
authors = ["Robin Kertels <robin.kertels@gmail.com>"]
edition = "2024"

[dependencies]
bitflags = "2.13"
bitset-core = "0.1"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
num_cpus = "1.17"
smallvec = { version = "1.15", features = ["union", "const_generics", "const_new"] }
serde = { version = "1.0", features = ["derive"] }
smartstring = "1.0"
futures-io = "0.3"
half = "2.7.1"

bevy_math = { version = "0.19", features = ["serialize"] }
bevy_log = "0.19"

[features]
default = []
non_send_gpu = []
non_send_io = []
